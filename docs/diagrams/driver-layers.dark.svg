<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">From pixels to pulses, on ESP-IDF</title>
<desc id="driver-layers-desc">Layer diagram: your application drives the WS2812Animator effects or a WS2812Strip directly; the strip turns pixels into RMT symbols and hands them to ws2812::RmtTx, which calls the ESP-IDF RMT driver; the RMT peripheral drives one GPIO connected to the first LED of the WS2812 chain.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="969" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">From pixels to pulses, on ESP-IDF</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">There is no port to write: the driver calls ESP-IDF's RMT driver directly, and the RMT peripheral times every bit.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#252F3C"/>
<rect x="32" y="278.4" width="1136" height="89" rx="16" fill="#1C1F3D" stroke="#3B4080" stroke-width="1.2"/>
