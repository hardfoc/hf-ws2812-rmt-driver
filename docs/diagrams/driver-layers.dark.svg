<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#2DD4BF"/>
<rect x="32" y="536.4" width="1136" height="114" rx="12" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
